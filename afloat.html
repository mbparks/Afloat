<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1117" />
  <meta name="description" content="AFLOAT — local-first vessel operations, passage planning, maintenance, resources, and logbook workbench." />
  <title>AFLOAT — Vessel Operations Workbench</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark" data-mode="cruising">
  <a class="skip-link" href="#content">Skip to main content</a>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">A</div>
        <div class="brand-copy">
          <div class="brand-name">AFLOAT</div>
          <div class="brand-sub">VESSEL OPERATIONS</div>
        </div>
      </div>
      <div class="vessel-mini" id="vesselMini"></div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="mode-switch" role="group" aria-label="Interface mode">
          <button class="seg active" data-mode-set="cruising">Cruising</button>
          <button class="seg" data-mode-set="engineering">Engineering</button>
        </div>
        <div class="version">AFLOAT <span id="versionLabel">v1.0.0</span></div>
      </div>
    </aside>
    <button id="sidebarScrim" class="sidebar-scrim" type="button" aria-label="Close navigation"></button>

    <main class="main" id="mainContent">
      <header class="topbar">
        <button id="sidebarToggle" class="icon-btn nav-toggle" aria-label="Toggle navigation" aria-expanded="true">☰</button>
        <div class="page-title-wrap">
          <div class="eyebrow" id="pageEyebrow">CURRENT VESSEL</div>
          <h1 id="pageTitle">Bridge</h1>
        </div>
        <div class="top-actions">
          <div class="connection-pill" id="connectionStatus" role="status" aria-live="polite"><span class="connection-dot"></span><span class="connection-text">OFFLINE READY</span></div>
          <button class="status-pill" id="saveStatus" title="Local autosave status" type="button"><span class="dot"></span><span>SAVED</span></button>
          <button class="icon-btn" id="globalSearchBtn" title="Search (Ctrl/Cmd+K)" aria-label="Search AFLOAT">⌕</button>
          <button class="primary-btn quick-log-btn" id="quickLogBtn"><span aria-hidden="true">+</span><span class="quick-log-text">Log</span></button>
        </div>
      </header>

      <section id="content" class="content" tabindex="-1" aria-live="polite"></section>
    </main>
  </div>

  <div id="inspectorRoot"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <input id="fileImport" type="file" accept="application/json,.json" hidden />
  <input id="fileVerify" type="file" accept="application/json,.json" hidden />

  <script type="module" src="js/app.js"></script>
</body>
</html>
